<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique — maquette interactive v2</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#141414; color:#e8e8e8; padding:24px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:#888; font-size:13px; margin-bottom:16px; }
  .shop { max-width:860px; margin:0 auto; background:#1b1b1b; border:1px solid #333; border-radius:12px; overflow:hidden; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#222; border-bottom:1px solid #333; }
  .topbar strong { letter-spacing:1px; }
  .money { font-weight:700; color:#7ee08a; }
  .money.broke { color:#e06a6a; }
  .tabs { display:flex; gap:2px; padding:0 12px; background:#222; }
  .tab { padding:9px 18px; cursor:pointer; color:#999; font-size:13px; border-bottom:3px solid transparent; }
  .tab.on { color:#f0e87a; border-color:#f0e87a; font-weight:700; }
  .pane { padding:16px; }
  .cols { display:flex; gap:14px; }
  .list { flex:1; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 11px; background:#232323; border:1px solid #383838; border-radius:7px; cursor:pointer; }
  .row:hover { border-color:#555; }
  .row.sel { border-color:#f0e87a; background:#2c2a18; }
  .row.lock { opacity:.5; cursor:not-allowed; }
  .pips { letter-spacing:3px; color:#f0e87a; font-size:13px; }
  .detail { flex:1.25; background:#181818; border:1px solid #333; border-radius:9px; padding:16px; }
  .dicon { width:54px; height:54px; border-radius:10px; background:linear-gradient(135deg,#3a3a3a,#2a2a2a); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .dname { font-size:16px; font-weight:700; margin-top:8px; }
  .ddesc { color:#9a9a9a; font-size:13px; margin:6px 0 12px; }
  .lvltable { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:12px; }
  .lvltable td { padding:5px 8px; border:1px solid #333; }
  .lvltable tr.cur { background:#2c2a18; color:#f0e87a; }
  .lvltable tr.next { background:#1d2533; }
  .btn { display:inline-block; padding:8px 16px; border-radius:7px; font-weight:700; font-size:13px; cursor:pointer; border:none; }
  .btn.up { background:#5aa9ff; color:#04122b; }
  .btn.buy { background:#5ad07a; color:#05210f; }
  .btn.max { background:#3a3a3a; color:#888; cursor:default; }
  .btn.cant { background:#5a3030; color:#e0a0a0; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .ccard { background:#232323; border:1px solid #383838; border-radius:9px; padding:12px; text-align:center; }
  .cicon { width:42px; height:42px; border-radius:8px; background:#2f2f2f; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .cmeta { color:#888; font-size:11px; margin:3px 0; }
  .owned { color:#7ee08a; font-size:11px; }
  .stepper { display:flex; align-items:center; justify-content:center; gap:8px; margin:8px 0 4px; }
  .stepbtn { width:24px; height:24px; border-radius:6px; border:1px solid #4a4a4a; background:#2c2c2c; color:#e8e8e8; font-weight:700; cursor:pointer; line-height:1; }
  .stepbtn:disabled { opacity:.35; cursor:default; }
  .qty { min-width:26px; text-align:center; font-weight:700; font-size:15px; }
  .total { color:#bbb; font-size:11px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#2c2a18; border:1px solid #f0e87a; color:#f0e87a; padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>Boutique — maquette interactive (v2 · conso à quantité)</h1>
<p class="sub">Consommables : achat à l'unité, choisis 1 à 10 par achat. Prix = prix unitaire × quantité.</p>

<div class="shop">
  <div class="topbar"><strong>BOUTIQUE — Agence</strong><span class="money" id="money">500 €</span></div>
  <div class="tabs">
    <div class="tab on" data-tab="outils" onclick="switchTab('outils')">Outils</div>
    <div class="tab" data-tab="conso" onclick="switchTab('conso')">Consommables</div>
  </div>

  <div class="pane" id="pane-outils">
    <div class="cols">
      <div class="list" id="toollist"></div>
      <div class="detail" id="tooldetail"></div>
    </div>
  </div>

  <div class="pane hidden" id="pane-conso">
    <div class="grid" id="consogrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let money = 500;

const tools = [
  { id:"crowbar", icon:"🔧", name:"Pied-de-biche", desc:"Force les portes verrouillées. Très bruyant.",
    owned:true, level:1,
    levels:[ {n:"Niv.1", eff:"Force 10", cost:0}, {n:"Niv.2", eff:"Force 20, -temps", cost:1500}, {n:"Niv.3", eff:"Force 35", cost:4000} ] },
  { id:"lockpick", icon:"🗝️", name:"Crochetage", desc:"Ouvre les serrures en silence (canalisation).",
    owned:true, level:0,
    levels:[ {n:"Niv.1", eff:"Canal. 2.0s", cost:0}, {n:"Niv.2", eff:"Canal. 1.3s", cost:1200}, {n:"Niv.3", eff:"Canal. 0.8s", cost:3000} ] },
  { id:"scanner", icon:"📱", name:"Scanner d'huissier", desc:"Révèle nom + valeur d'un objet.",
    owned:false, buyPrice:600, lockedUntil:2,
    levels:[ {n:"Niv.1", eff:"Scan 1 objet", cost:0}, {n:"Niv.2", eff:"+ portée", cost:900}, {n:"Niv.3", eff:"Scan zone", cost:2200} ] },
  { id:"uv", icon:"🔦", name:"Lampe UV", desc:"Révèle pièges et cachettes.",
    owned:false, buyPrice:800, lockedUntil:0,
    levels:[ {n:"Niv.1", eff:"Portée 3m", cost:0}, {n:"Niv.2", eff:"Portée 6m", cost:1100}, {n:"Niv.3", eff:"À travers murs", cost:2800} ] },
];

// Conso : prix UNITAIRE, achat 1 à 10, max = limite d'emport / mission
const consos = [
  { id:"smoke", icon:"💨", name:"Fumigène", owned:4, price:50, max:3, qty:1 },
  { id:"sardine", icon:"🐟", name:"Sardines (appât)", owned:2, price:30, max:5, qty:1 },
  { id:"antitheft", icon:"🔒", name:"Antivol coffre", owned:0, price:80, max:1, qty:1 },
];

const DERNIERE_MISSION = 0;
let selected = "crowbar";

function fmt(v){ return v + " €"; }
function setMoney(v){ money=v; const el=document.getElementById('money'); el.textContent=fmt(v); el.classList.toggle('broke', v<=0); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
function pips(level, total){ let s=""; for(let i=0;i<total;i++) s+= i<=level?"●":"○"; return s; }

function renderList(){
  const L=document.getElementById('toollist'); L.innerHTML="";
  tools.forEach(t=>{
    const locked = !t.owned && t.lockedUntil>DERNIERE_MISSION;
    const r=document.createElement('div');
    r.className="row"+(t.id===selected?" sel":"")+(locked?" lock":"");
    let right = t.owned ? '<span class="pips">'+pips(t.level,t.levels.length)+'</span>'
              : locked ? '<span style="color:#888;font-size:11px">🔒 M'+t.lockedUntil+'</span>'
              : '<span style="color:#7ee08a;font-size:11px">'+fmt(t.buyPrice)+'</span>';
    r.innerHTML='<span>'+t.icon+'  '+t.name+'</span>'+right;
    if(!locked) r.onclick=()=>{ selected=t.id; render(); };
    L.appendChild(r);
  });
}

function renderDetail(){
  const t=tools.find(x=>x.id===selected);
  const D=document.getElementById('tooldetail');
  const locked = !t.owned && t.lockedUntil>DERNIERE_MISSION;
  let rows="";
  t.levels.forEach((lv,i)=>{
    let cls = t.owned && i===t.level ? "cur" : (t.owned && i===t.level+1 ? "next" : "");
    let cost = i===0 ? (t.owned?"acquis":fmt(t.buyPrice)) : fmt(lv.cost);
    rows+='<tr class="'+cls+'"><td>'+lv.n+'</td><td>'+lv.eff+'</td><td>'+cost+'</td></tr>';
  });
  let btn;
  if(locked){ btn='<button class="btn max">🔒 Débloqué après mission '+t.lockedUntil+'</button>'; }
  else if(!t.owned){ btn = money>=t.buyPrice ? '<button class="btn buy" onclick="buyTool(\''+t.id+'\')">Acheter · '+fmt(t.buyPrice)+'</button>' : '<button class="btn cant">Fonds insuffisants ('+fmt(t.buyPrice)+')</button>'; }
  else if(t.level>=t.levels.length-1){ btn='<button class="btn max">Niveau max</button>'; }
  else { const c=t.levels[t.level+1].cost; btn = money>=c ? '<button class="btn up" onclick="upgradeTool(\''+t.id+'\')">Upgrader → '+t.levels[t.level+1].n+' · '+fmt(c)+'</button>' : '<button class="btn cant">Fonds insuffisants ('+fmt(c)+')</button>'; }
  D.innerHTML='<div class="dicon">'+t.icon+'</div><div class="dname">'+t.name+(t.owned?' · '+pips(t.level,t.levels.length):'')+'</div><div class="ddesc">'+t.desc+'</div><table class="lvltable">'+rows+'</table>'+btn;
}

function buyTool(id){ const t=tools.find(x=>x.id===id); if(money<t.buyPrice) return; setMoney(money-t.buyPrice); t.owned=true; t.level=0; toast("Acheté : "+t.name); render(); }
function upgradeTool(id){ const t=tools.find(x=>x.id===id); const c=t.levels[t.level+1].cost; if(money<c) return; setMoney(money-c); t.level++; toast(t.name+" → "+t.levels[t.level].n); render(); }

function renderConso(){
  const G=document.getElementById('consogrid'); G.innerHTML="";
  consos.forEach(c=>{
    const total = c.price*c.qty;
    const can = money>=total;
    const card=document.createElement('div'); card.className="ccard";
    card.innerHTML='<div class="cicon">'+c.icon+'</div><div>'+c.name+'</div>'+
      '<div class="cmeta">'+fmt(c.price)+' / unité · max '+c.max+'/mission</div>'+
      '<div class="owned">possédés : '+c.owned+'</div>'+
      '<div class="stepper">'+
        '<button class="stepbtn" '+(c.qty<=1?'disabled':'')+' onclick="stepConso(\''+c.id+'\',-1)">−</button>'+
        '<span class="qty">'+c.qty+'</span>'+
        '<button class="stepbtn" '+(c.qty>=10?'disabled':'')+' onclick="stepConso(\''+c.id+'\',1)">+</button>'+
      '</div>'+
      '<div class="total">total : '+fmt(total)+'</div>'+
      (can?'<button class="btn buy" style="margin-top:8px" onclick="buyConso(\''+c.id+'\')">Acheter ×'+c.qty+'</button>'
          :'<button class="btn cant" style="margin-top:8px">Fonds insuffisants</button>');
    G.appendChild(card);
  });
}
function stepConso(id,d){ const c=consos.find(x=>x.id===id); c.qty=Math.min(10,Math.max(1,c.qty+d)); renderConso(); }
function buyConso(id){ const c=consos.find(x=>x.id===id); const total=c.price*c.qty; if(money<total) return; setMoney(money-total); c.owned+=c.qty; toast("+"+c.qty+" "+c.name); c.qty=1; renderConso(); }

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===tab));
  document.getElementById('pane-outils').classList.toggle('hidden', tab!=='outils');
  document.getElementById('pane-conso').classList.toggle('hidden', tab!=='conso');
  if(tab==='conso') renderConso();
}

function render(){ renderList(); renderDetail(); }
render();
</script>
</body>
</html>
